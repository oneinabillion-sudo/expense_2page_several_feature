name: ConfirmBuild

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: コードのチェックアウト
        uses: actions/checkout@v5
        
      - name: JDKのセットアップ
        uses: actions/setup-java@v5

        with:
          java-version: '25'
          distribution: 'temurin'

      - name: mvnwの実行権限付与
        run: chmod +x ./mvnw

      - name: Compile実行
        run: ./mvnw compile