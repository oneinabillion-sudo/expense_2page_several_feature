<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <script th:src="@{/js/app.js}" defer></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>編集画面</title>
</head>

<body>
    <div class="container-sm">
        <h4 class="my-3">編集画面</h4><br>

            <div class="row align-items-start"><!--一括更新＆削除-->
                <form th:action="@{/update}" th:object="${listUpdateForm}" method="post">

                    <table class="table table-striped-columns">
                        <thead>
                            <tr class="table-primary">
                                <th class="text-center" scope="col">日付</th>
                                <th scope="col">費目</th>
                                <th scope="col">メモ</th>
                                <th class="text-center" scope="col">入金額</th>
                                <th class="text-center" scope="col">出金額</th>
                                <th scope="col">削除</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="table-light" th:each="r, stat : ${Expense_RC}">
                                <td class="text-center">
                                    <span th:text="${r.recordDate}"></span>
                                    <input type="hidden" th:name="|listCheck[${stat.index}].recordId|" th:value="${r.recordId}">
                                </td>
                                <td>
                                <select class="form-select" th:name="|listCheck[${stat.index}].expenseId|">
                                    <option th:each=" c : ${categories}" 
                                        th:value="${c.expenseId }"
                                        th:text="${c.expenseName}"
                                        th:style="${c.expenseBool} ? 'background-color: lightgreen' : 'background-color:#FF00FF'"
                                        th:selected="${c.expenseName == r.expenseName}">
                                    </option>
                                </select>
                                </td>
                                <td>
                                    <div th:if="${#fields.hasErrors('listCheck[__${stat.index}__].memo')}" th:errors="*{listCheck[__${stat.index}__].memo}"></div>
                                    <input class="form-control" type="text" th:name="|listCheck[${stat.index}].memo|" th:value="${r.memo}">
                                </td>
                                <td class="text-center" th:text="${r.deposit}"></td>
                                <td class="text-center" th:text="${r.withdraw}"></td>
                            <td>
                            <button class="btn btn-secondary" type="submit" th:formaction="@{/records/{recordId}/delete(recordId=${r.recordId})}" formmethod="post">削除する</button>
                            </td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="col-12">
                        <button class="btn btn-dark" type="submit">更新する</button>
                    </div><br>
                    
                </form>
            </div>

            <form th:action="@{/manage}">
                <div class="col-12">
                    <button class="btn btn-dark" type="submit">戻る</button>
                </div>
            </form>
    </div>
</body>

</html>
