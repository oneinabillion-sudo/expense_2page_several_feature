                    <table class="table table-striped-columns">
                        <thead>
                            <tr class="table-primary">
                                <th class="text-center" scope="col">日付</th>
                                <th scope="col">費目</th>
                                <th scope="col">メモ</th>
                                <th class="text-center" scope="col">入金額</th>
                                <th class="text-center" scope="col">出金額</th>
                                <th scope="col">削除</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="table-light" th:each="r, stat : ${Expense_RC}">
                                <td class="text-center">
                                    <span th:text="${r.record_date}"></span>
                                    <input type="hidden" th:name="|listCheck[${stat.index}].record_id|" th:value="${r.record_id}">
                                </td>
                                <td>
                                <select class="form-select" th:name="|listCheck[${stat.index}].expense_id|">
                                    <option th:each=" c : ${categores}" 
                                        th:value="${c.expense_id }"
                                        th:text="${c.expense_name}"
                                        th:style="${c.expense_bool} ? 'background-color: lightgreen' : 'background-color:#FF00FF'"
                                        th:selected="${c.expense_name == r.expense_name}">
                                    </option>
                                </select>
                                </td>
                                <td>
                                    <div th:if="${#fields.hasErrors('listCheck[__${stat.index}__].memo')}" th:errors="*{listCheck[__${stat.index}__].memo}"></div>
                                    <input class="form-control" type="text" th:name="|listCheck[${stat.index}].memo|" th:value="${r.memo}">
                                </td>
                                <td class="text-center" th:text="${r.deposit}"></td>
                                <td class="text-center" th:text="${r.withdraw}"></td>
                            <td>
                            <button class="btn btn-secondary" type="submit" th:formaction="@{/records/{record_id}/delete(record_id=${r.record_id})}" formmethod="post">削除する</button>
                            </td>
                            </tr>
                        </tbody>
                    </table>
                    <div class="col-12">
                        <button class="btn btn-dark" type="submit">更新する</button>
